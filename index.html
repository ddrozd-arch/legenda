<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎉 Marcin 50 - Level Unlocked</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html, body {
height:100%;
}

body{
font-family:Segoe UI,Arial,sans-serif;
background:#0f172a;
color:white;
overflow:hidden;
}

#boot{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

.terminal{
max-width:600px;
width:90%;
font-family:Consolas,monospace;
color:#00ff88;
font-size:1rem;
line-height:1.6;
padding:30px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.boot-line {
margin: 6px 0;
min-height: 20px;
opacity: 0;
}

.boot-line.visible {
animation: typewriter 0.4s ease-out forwards;
}

@keyframes typewriter {
  from { opacity: 0; }
  to { opacity: 1; }
}

.boot-progress {
margin-top: 25px;
width: 100%;
}

.progress-bar {
width: 250px;
height: 20px;
background: #111;
border: 2px solid #00ff88;
border-radius: 5px;
overflow: hidden;
margin: 12px auto;
}

.progress-fill {
height: 100%;
background: linear-gradient(90deg, #00ff88, #00cc66);
width: 0%;
transition: width 0.1s linear;
}

.progress-text {
color: #00ff88;
font-size: 0.8rem;
margin-top: 8px;
}

.unlock-btn{
padding:16px 40px;
border:3px solid #ffb300;
border-radius:12px;
cursor:pointer;
font-size:18px;
font-weight:700;
background:#ffb300;
color:#111;
margin-top:25px;
transition: all 0.3s ease;
box-shadow: 0 0 20px rgba(255, 179, 0, 0.5);
animation: pulse 1s ease-in-out infinite;
opacity: 0;
}

.unlock-btn.show {
opacity: 1;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 20px rgba(255, 179, 0, 0.5), 0 0 40px rgba(255, 179, 0, 0.3);
  }
  50% {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(255, 179, 0, 0.8), 0 0 60px rgba(255, 179, 0, 0.5);
  }
}

.unlock-btn:hover {
animation: pulse-hover 0.6s ease-in-out infinite;
}

@keyframes pulse-hover {
  0%, 100% {
    transform: scale(1.1);
    box-shadow: 0 0 40px rgba(255, 179, 0, 0.9), 0 0 80px rgba(255, 179, 0, 0.6);
  }
  50% {
    transform: scale(1.15);
    box-shadow: 0 0 50px rgba(255, 179, 0, 1), 0 0 100px rgba(255, 179, 0, 0.8);
  }
}

.unlock-btn:active {
transform: scale(0.95);
}

#app {
position: relative;
width: 100vw;
height: 100vh;
display: none;
background: #05070d;
}

#transition-screen {
position: absolute;
inset: 0;
display: none;
align-items:center;
justify-content:center;
background: rgba(0,0,0,0.7);
z-index: 20;
}

#transition-image {
position: relative;
width: 100%;
height: 100%;
background-image: url('assets/9CF89855-F96C-412F-9730-9074E437B3D4.png');
background-size: cover;
background-position: center center;
background-repeat: no-repeat;
transform: scale(1.08);
filter: brightness(1.1) saturate(1.2);
}

#transition-image::before {
content: "";
position: absolute;
inset: 0;
background: rgba(255,255,255,0.12);
}

#transition-screen.shake {
animation: shake 0.7s ease-in-out 2;
}

#transition-screen.flash {
animation: flash 0.9s ease-in-out 1;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-16px) rotate(-1deg); }
  40% { transform: translateX(16px) rotate(1deg); }
  60% { transform: translateX(-12px) rotate(-1deg); }
  80% { transform: translateX(12px) rotate(1deg); }
}

@keyframes flash {
  0% { box-shadow: inset 0 0 0 rgba(255,255,255,0); }
  20% { box-shadow: inset 0 0 120px rgba(255,255,255,0.85); }
  100% { box-shadow: inset 0 0 0 rgba(255,255,255,0); }
}

.hero{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#ff9500,#ff006e);
text-align:center;
}

.hero h1{
font-size:4rem;
margin-top:30px;
}

.hero h2{
font-size:2rem;
opacity:.9;
}

.stats{
display:flex;
gap:40px;
flex-wrap:wrap;
justify-content:center;
margin-top:40px;
}

.stat{
background:rgba(255,255,255,.15);
padding:25px;
border-radius:16px;
min-width:180px;
}

.stat span{
font-size:48px;
font-weight:bold;
display:block;
}

.memes,
.gallery,
.achievements,
.facts,
.final,
.progress {
height:100vh;
}

.card {
background:#1f2937;
padding:25px;
border-radius:20px;
border:2px solid #374151;
transition:.3s;
}

.card:hover{ transform:translateY(-8px); }

@media(max-width:768px){
  .hero h1{ font-size:2.5rem; }
  .terminal { font-size: 0.85rem; padding: 20px; }
}

</style>
</head>

<body>

<div id="boot">
  <div class="terminal">
    <p class="boot-line">BOOTING MARCIN OS 50.0...</p>
    <p class="boot-line">Checking age...</p>
    <p class="boot-line">Age Detected: 50</p>
    <p class="boot-line">Loading:</p>
    <p class="boot-line">✅ doświadczenie</p>
    <p class="boot-line">✅ cierpliwość</p>
    <p class="boot-line">✅ imprezowe historie</p>
    <p class="boot-line" style="color:gold">LEGENDARY USER FOUND</p>

    <div class="boot-progress">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>

    <button class="unlock-btn" id="startBtn">
      🔓 ODBLOKUJ LEGENDĘ 🔓
    </button>
  </div>
</div>

<div id="app">
  <div id="transition-screen">
    <div id="transition-image"></div>
  </div>

  <section class="hero">
    <h1>🎉 LEVEL 50 UNLOCKED 🎉</h1>
    <h2>Nadal bardziej legendarny niż większość dwudziestolatków</h2>

    <div class="stats">
      <div class="stat"><span id="exp">0</span>Poziom</div>
      <div class="stat"><span id="wisdom">0</span>Mądrość</div>
      <div class="stat"><span id="stories">0</span>Historie</div>
    </div>
  </section>
</div>

<script>
const bootLines = document.querySelectorAll('.boot-line');
const progressBar = document.querySelector('.progress-fill');
const progressText = document.getElementById('progressText');
const unlockBtn = document.getElementById('startBtn');
const bootScreen = document.getElementById('boot');
const app = document.getElementById('app');
const transitionScreen = document.getElementById('transition-screen');
const transitionImage = document.getElementById('transition-image');

function startBootSequence() {
  let lineIndex = 0;
  let progress = 0;

  const lineInterval = setInterval(() => {
    if (lineIndex < bootLines.length) {
      bootLines[lineIndex].classList.add('visible');
      lineIndex++;
      progress = Math.min(progress + (85 / bootLines.length), 85);
      progressBar.style.width = progress + '%';
      progressText.textContent = Math.round(progress) + '%';
    } else {
      clearInterval(lineInterval);
      setTimeout(() => {
        progressBar.style.width = '100%';
        progressText.textContent = '100%';
        setTimeout(() => {
          unlockBtn.classList.add('show');
        }, 300);
      }, 500);
    }
  }, 400);
}

window.addEventListener('load', startBootSequence);

function boom() {
  confetti({ particleCount: 300, spread: 180, origin: { y: 0.6 } });
}

function counter(id, target) {
  let current = 0;
  const timer = setInterval(() => {
    current += Math.ceil(target / 40);
    if (current >= target) {
      current = target;
      clearInterval(timer);
    }
    document.getElementById(id).innerText = current;
  }, 30);
}

unlockBtn.addEventListener('click', () => {
  bootScreen.style.display = 'none';
  app.style.display = 'block';

  transitionScreen.style.display = 'flex';
  transitionScreen.classList.remove('shake', 'flash');
  void transitionScreen.offsetWidth;
  transitionScreen.classList.add('shake', 'flash');
  boom();

  setTimeout(() => {
    transitionScreen.style.display = 'none';
    counter('exp', 50);
    counter('wisdom', 99);
    counter('stories', 999);
  }, 10000);
});
</script>
</body>
</html>
